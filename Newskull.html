<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Brain - Hacker Login</title>
<style>
*{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body{
    width: 100%;
    height: 100%;
    background: #020304;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.login-card{
    position: relative;
    width: 100%;
    max-width: 380px;
    height: 100%;
    max-height: 680px;
    background: radial-gradient(ellipse at 50% 20%, #24282e 0%, #111419 32%, #07090c 72%, #030405 100%);
    border: 1px solid #30343a;
    border-radius: 18px;
    box-shadow: 0 0 40px rgba(0,0,0,.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 15px;
    overflow-y: auto;
}

.top-light{
    position: absolute;
    top: 0;
    left: 20%;
    width: 60%;
    height: 3px;
    background: #fff;
    border-radius: 0 0 8px 8px;
    box-shadow: 0 0 10px #fff, 0 0 20px rgba(255,255,255,.8);
}

.skull-area{
    width: 100%;
    height: 280px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 5px;
}

.skull{
    width: 240px;
    height: 270px;
    overflow: visible;
}

.bone{ fill: none; stroke: #f3f3f3; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.bone-thin{ fill: none; stroke: #cfcfcf; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.cranium{ fill: #050607; stroke: #f2f2f2; stroke-width: 4; }
.skull-base{ fill: #050607; stroke: #f2f2f2; stroke-width: 4; }
.tooth{ fill: #eeeeee; stroke: #111; stroke-width: 1.7; }

.eye{
    fill: #baff00;
    stroke: #efff9a;
    stroke-width: 2;
    filter: drop-shadow(0 0 4px #baff00) drop-shadow(0 0 10px #baff00);
}

.lower-jaw{
    transform-box: fill-box;
    transform-origin: center top;
    animation: jawChatter 3.2s infinite linear;
}

@keyframes jawChatter{
    0%{ transform: translateY(0); }
    3%{ transform: translateY(8px); }
    6%{ transform: translateY(0); }
    9%{ transform: translateY(10px); }
    12%{ transform: translateY(0); }
    15%{ transform: translateY(8px); }
    18%{ transform: translateY(0); }
    21%{ transform: translateY(10px); }
    24%{ transform: translateY(0); }
    27%{ transform: translateY(8px); }
    30%, 100%{ transform: translateY(0); }
}

.network{
    color: #e6e6e6;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 4px;
    text-align: center;
    margin: 5px 0 15px 0;
    text-shadow: 0 0 6px rgba(255,255,255,.25);
}

.login-form{
    width: 90%;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.input-box{
    width: 100%;
    height: 48px;
    background: linear-gradient(180deg, #f3f3f3, #dcdcdc);
    border-radius: 6px;
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
    overflow: hidden;
}

.input-box input{
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: #111;
    padding: 0 15px;
    font-size: 15px;
    font-weight: 600;
}

.input-box input::placeholder{
    color: #666;
    letter-spacing: 1px;
}

.password-container{
    display: flex;
    width: 100%;
    height: 48px;
}

.password-container .input-box{
    flex: 1;
    border-radius: 6px 0 0 6px;
}

.login-button{
    width: 52px;
    height: 48px;
    border: none;
    background: linear-gradient(180deg, #eeeeee, #cfcfcf);
    border-radius: 0 6px 6px 0;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
}

.lock{
    position: relative;
    width: 16px;
    height: 15px;
    background: #111;
    border-radius: 2px;
}

.lock::before{
    content: "";
    position: absolute;
    width: 9px;
    height: 10px;
    left: 3.5px;
    top: -8px;
    border: 2.5px solid #111;
    border-bottom: none;
    border-radius: 7px 7px 0 0;
}

.footer{
    margin-top: auto;
    padding-top: 15px;
    color: #555;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 3px;
    text-align: center;
}
</style>
</head>

    <div class="network">HACKERS NETWORK</div>

    <form class="login-form" onsubmit="login(event)">
        <div class="input-box">
            <input id="username" type="text" placeholder="USERNAME..." autocomplete="username">
        </div>
        <div class="password-container">
            <div class="input-box">
                <input id="password" type="password" placeholder="PASSWORD..." autocomplete="current-password">
            </div>
            <button class="login-button" type="submit" aria-label="Login">
                <span class="lock"></span>
            </button>
        </div>

<script>
function login(event){
    event.preventDefault();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    if(!username || !password){
        alert("Please enter username and password.");
        return;
    }
    alert("Access Granted for: " + username);
}
</script>
